{% load static i18n %}
<link rel="icon" href="{% static 'bookings/karlak-favicon-v153.png' %}" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="{% static 'bookings/karlak-apple-touch-v153.png' %}" sizes="180x180">
{% if PUBLIC149 %}
<meta name="description" content="{{ PUBLIC149.description }}">
{% if PUBLIC149.private %}<meta name="robots" content="noindex, nofollow, noarchive">{% else %}<link rel="canonical" href="{{ PUBLIC149.canonical }}">{% endif %}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ PUBLIC149.brand }}">
<meta property="og:title" content="{% if PUBLIC149.title %}{{ PUBLIC149.title }}{% else %}{{ PUBLIC149.brand }} · {% translate 'Mountain stays' %}{% endif %}">
<meta property="og:description" content="{{ PUBLIC149.description }}">
<meta property="og:url" content="{{ PUBLIC149.canonical }}">
<meta property="og:locale" content="{{ PUBLIC149.locale }}">
<meta property="og:image" content="{{ PUBLIC149.social_image }}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="{{ PUBLIC149.social_width|default:1200 }}">
<meta property="og:image:height" content="{{ PUBLIC149.social_height|default:630 }}">
<meta property="og:image:alt" content="{% if PUBLIC149.social_alt %}{{ PUBLIC149.social_alt }}{% else %}{% translate 'Green fields and forested ridges in the Rhodope Mountains, Bulgaria' %}{% endif %}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if PUBLIC149.title %}{{ PUBLIC149.title }}{% else %}{{ PUBLIC149.brand }} · {% translate 'Mountain stays' %}{% endif %}">
<meta name="twitter:description" content="{{ PUBLIC149.description }}">
<meta name="twitter:image" content="{{ PUBLIC149.social_image }}">
<meta name="twitter:image:alt" content="{% if PUBLIC149.social_alt %}{{ PUBLIC149.social_alt }}{% else %}{% translate 'Green fields and forested ridges in the Rhodope Mountains, Bulgaria' %}{% endif %}">
{% endif %}
