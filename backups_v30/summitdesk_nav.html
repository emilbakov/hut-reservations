{% if visible %}
<style>
/* V28 shared staff shell; prefixed selectors avoid legacy component collisions. */
.sd28-top{position:sticky;top:0;z-index:90;height:62px;background:#173f36;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:0 2px 12px #0002;font:500 14px system-ui,sans-serif}
.sd28-top a{color:#fff;text-decoration:none}.sd28-brand{font-size:19px;font-weight:800;letter-spacing:-.4px}.sd28-brand b{color:#b7eb73}.sd28-topright{display:flex;align-items:center;gap:18px}.sd28-topright span{font-size:13px;color:#cfe3d8}.sd28-nav{position:fixed;z-index:89;left:0;top:62px;bottom:0;width:218px;background:#f9fbf8;border-right:1px solid #dce6de;overflow:auto;padding:20px 10px;font:500 14px system-ui,sans-serif}.sd28-hut{padding:8px 12px 17px;font-size:12px;color:#547266;overflow-wrap:anywhere}.sd28-link{display:flex;gap:12px;align-items:center;padding:12px 13px;margin:2px 0;border-radius:10px;color:#25483c!important;text-decoration:none!important;font-weight:600}.sd28-link:hover,.sd28-link:focus-visible{background:#eaf2e5}.sd28-link[aria-current=page]{background:#dcefcf;color:#184b31!important}.sd28-symbol{width:18px;text-align:center;font-size:18px}.sd28-mobile{display:none}
@media(min-width:861px){body:has(>.sd28-top){padding-left:218px!important}.sd28-top{margin-left:-218px}.sd28-nav{display:block}}
@media(max-width:860px){.sd28-nav{position:relative;top:auto;bottom:auto;width:100%;display:flex;gap:5px;padding:8px 10px;overflow-x:auto;white-space:nowrap;border-right:0;border-bottom:1px solid #dce6de}.sd28-hut{display:none}.sd28-link{flex:none;padding:9px 11px}.sd28-symbol{display:none}.sd28-topright span{display:none}.sd28-top{height:58px;padding:0 14px}.sd28-brand{font-size:17px}}
</style>
<header class="sd28-top" aria-label="SummitDesk top bar"><a class="sd28-brand" href="{% url 'floorplans:staff_hub' hut.pk %}">Summit<b>Desk</b></a><div class="sd28-topright"><span>{{ hut.name }} · {% if manager %}Manager{% else %}Cleaner{% endif %}</span><a href="{% url 'floorplans:staff_hub' hut.pk %}" aria-label="Return to dashboard">Dashboard ↗</a></div></header>
<nav class="sd28-nav" aria-label="SummitDesk staff navigation"><div class="sd28-hut">{{ hut.name }}</div>{% for link in links %}<a class="sd28-link" href="{{ link.url }}" {% if link.active %}aria-current="page"{% endif %}><span class="sd28-symbol" aria-hidden="true">{{ link.symbol }}</span>{{ link.label }}</a>{% endfor %}</nav>
{% endif %}
